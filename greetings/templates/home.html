<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Приветствие</title>

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'style.css' %}"
    >

</head>


<body>

    <main class="card">

        <h1>
            Введите имя
        </h1>


        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Submit
            </button>

        </form>


        {% if greeting %}

            <p class="greeting">
                {{ greeting }}
            </p>

        {% endif %}

    </main>

</body>

</html>
